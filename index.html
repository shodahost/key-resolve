<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DaVinci Resolve Shortcuts — Cheat Sheet</title>
<meta name="description" content="Interactive DaVinci Resolve keyboard shortcut cheat sheet for learners: shortcuts checked against Resolve's default keyboard preset, grouped by page, with levels, pro tips, flashcards and progress tracking. English + Polish.">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0b0f">
<script>
  // Apply saved view settings before first paint (no flash).
  try {
    var s = JSON.parse(localStorage.getItem('kr.settings') || '{}'), d = document.documentElement;
    if (s.theme === 'light' || s.theme === 'dark') d.setAttribute('data-theme', s.theme);
    if (s.density === 'compact') d.classList.add('compact');
    if (localStorage.getItem('kr.heroMin') === '1') d.classList.add('hero-min');
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>

    <div class="stats" id="stats"></div>
  </div></div>
</header>

        <kbd class="search-hint" aria-hidden="true">/</kbd>
